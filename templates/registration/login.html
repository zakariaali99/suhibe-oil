<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام الزيوت</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --oil-navy: #1A1D2E;
            --oil-gold: #D4A745;
            --oil-bg: #F8FAF0;
        }
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--oil-navy);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .login-card {
            width: 450px;
            background: white;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-header {
            background: var(--oil-navy);
            padding: 40px;
            text-align: center;
            border-bottom: 5px solid var(--oil-gold);
        }
        .form-control {
            border-radius: 12px;
            padding: 12px 20px;
            border: 2px solid #eee;
        }
        .form-control:focus {
            border-color: var(--oil-gold);
            box-shadow: none;
        }
        .btn-login {
            background-color: var(--oil-gold);
            color: var(--oil-navy);
            font-weight: bold;
            border-radius: 12px;
            padding: 12px;
            border: none;
            transition: all 0.3s;
        }
        .btn-login:hover {
            background-color: #c49635;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header text-white">
            <i class="bi bi-droplet-fill text-gold display-4 mb-3"></i>
            <h3 class="fw-bold">نظام الزيوت المتطور</h3>
            <p class="text-white-50 small mb-0">يرجى تسجيل الدخول للوصول للوحة التحكم</p>
        </div>
        <div class="p-5">
            {% if messages %}
                {% for message in messages %}
                <div class="alert alert-danger small rounded-3 border-0 py-2">
                    <i class="bi bi-exclamation-circle me-1"></i>{{ message }}
                </div>
                {% endfor %}
            {% endif %}
            
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold text-navy small">اسم المستخدم</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-0"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control bg-light border-0" required autofocus>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold text-navy small">كلمة المرور</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-0"><i class="bi bi-shield-lock"></i></span>
                        <input type="password" name="password" class="form-control bg-light border-0" required>
                    </div>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-login">دخول النظام <i class="bi bi-box-arrow-in-left ms-2"></i></button>
                </div>
            </form>
            <div class="text-center mt-4">
                <a href="{% url 'product_list' %}" class="text-decoration-none text-muted small"><i class="bi bi-arrow-right me-1"></i>العودة لواجهة المبيعات</a>
            </div>
        </div>
    </div>
</body>
</html>
